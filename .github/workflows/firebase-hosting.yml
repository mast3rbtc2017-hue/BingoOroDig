name: Deploy Firebase Hosting

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "artifacts/bingo-orodig/**"
      - "firebase.json"
      - ".github/workflows/firebase-hosting.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --ignore-scripts

      - name: Build frontend
        run: pnpm --filter @workspace/bingo-orodig run build
        env:
          PORT: "4173"
          BASE_PATH: "/"
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy hosting
        run: npx firebase-tools deploy --only hosting --project bingoorodig --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
